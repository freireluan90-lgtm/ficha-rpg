name: Publish Ficha Livre v2.4

on:
  push:
    paths:
      - 'release-sign/v24-ready'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact unsigned v2.4 build
        uses: actions/download-artifact@v4
        with:
          name: ficha-livre-v2.4-unsigned
          path: unsigned
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37300484773

      - name: Reapply verified v2 signing block
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          src = Path('unsigned/app-release-unsigned.apk')
          out = Path('releases/Ficha-Livre-v2.4.apk')
          block_file = Path('release-sign/v24-block.b64')
          u = src.read_bytes()
          assert hashlib.sha256(u).hexdigest() == 'b60b72aee6837ce550d7702679b9cdd28aa060b142902266d10f765164fcba43'

          def find_eocd(data):
              pos = data.rfind(b'PK\x05\x06', max(0, len(data)-65557))
              if pos < 0:
                  raise RuntimeError('EOCD not found')
              comment = struct.unpack_from('<H', data, pos+20)[0]
              if pos + 22 + comment != len(data):
                  raise RuntimeError('EOCD mismatch')
              cd_size = struct.unpack_from('<I', data, pos+12)[0]
              cd_off = struct.unpack_from('<I', data, pos+16)[0]
              if cd_off + cd_size != pos:
                  raise RuntimeError('central directory mismatch')
              return pos, cd_off

          eocd, cd_off = find_eocd(u)
          block = base64.b64decode(block_file.read_text().strip())
          assert len(block) == 1450
          assert hashlib.sha256(block).hexdigest() == 'bd8c955abd57ea5e0d1f409c3615d7e34845e271a83f8185a2ba9da3be6d55b5'
          assert block[-16:] == b'APK Sig Block 42'

          final_eocd = bytearray(u[eocd:])
          struct.pack_into('<I', final_eocd, 16, cd_off + len(block))
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(u[:cd_off] + block + u[cd_off:eocd] + bytes(final_eocd))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          assert digest == '9377e0f0497660a98517e2e78abc7e07c069d758a2b3b1d0f5561a71c8c1efcd', digest
          print('Signed APK verified:', out, digest)
          PY
          unzip -t releases/Ficha-Livre-v2.4.apk

      - name: Publish update manifest
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.4",
            "versionCode": 24,
            "apk": "https://raw.githubusercontent.com/freireluan90-lgtm/ficha-rpg/main/releases/Ficha-Livre-v2.4.apk",
            "sha256": "9377e0f0497660a98517e2e78abc7e07c069d758a2b3b1d0f5561a71c8c1efcd",
            "notes": "Atualizador corrigido: a consulta de novas versões agora é feita pelo Android nativo. Mantém os cálculos automáticos de PV, PE, C.A. e MS e a distribuição de progressão da v2.3."
          }
          JSON

      - name: Commit release
        run: |
          rm -f release-sign/v24-ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A releases/Ficha-Livre-v2.4.apk latest.json release-sign/v24-ready
          git commit -m 'Publica Ficha Livre v2.4'
          git push
