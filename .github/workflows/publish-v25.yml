name: Publish Ficha Livre v2.5

on:
  push:
    paths:
      - 'release-sign/v25-ready'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact unsigned v2.5 build
        uses: actions/download-artifact@v4
        with:
          name: ficha-livre-v2.5-unsigned
          path: unsigned
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37304912838

      - name: Reapply verified v2 signing block
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          src = Path('unsigned/app-release-unsigned.apk')
          out = Path('releases/Ficha-Livre-v2.5.apk')
          block_file = Path('release-sign/v25-block.b64')
          u = src.read_bytes()
          assert hashlib.sha256(u).hexdigest() == 'c154898ca8b921a43717e24a7be336926b42f3c2e55bcd3c8762b3de90abdafd'

          def find_eocd(data):
              pos = data.rfind(b'PK\x05\x06', max(0, len(data)-65557))
              if pos < 0:
                  raise RuntimeError('EOCD not found')
              comment = struct.unpack_from('<H', data, pos+20)[0]
              if pos + 22 + comment != len(data):
                  raise RuntimeError('EOCD mismatch')
              cd_size = struct.unpack_from('<I', data, pos+12)[0]
              cd_off = struct.unpack_from('<I', data, pos+16)[0]
              if cd_off + cd_size != pos:
                  raise RuntimeError('central directory mismatch')
              return pos, cd_off

          eocd, cd_off = find_eocd(u)
          block = base64.b64decode(block_file.read_text().strip())
          assert len(block) == 1450
          assert hashlib.sha256(block).hexdigest() == '954dd137635418687ba5f0e80d904f69dc6badd46f2d4b0656233fbfc774e2c2'
          assert block[-16:] == b'APK Sig Block 42'

          final_eocd = bytearray(u[eocd:])
          struct.pack_into('<I', final_eocd, 16, cd_off + len(block))
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(u[:cd_off] + block + u[cd_off:eocd] + bytes(final_eocd))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          assert digest == 'c51d86f5ee052983f46aad0f4d93a5e381560e5c2999a844ead9dd3dde5ddebf', digest
          print('Signed APK verified:', out, digest)
          PY
          unzip -t releases/Ficha-Livre-v2.5.apk

      - name: Publish update manifest
        run: |
          cat > latest.json <<'JSON'
          {
            "version": "2.5",
            "versionCode": 25,
            "apk": "https://raw.githubusercontent.com/freireluan90-lgtm/ficha-rpg/main/releases/Ficha-Livre-v2.5.apk",
            "sha256": "c51d86f5ee052983f46aad0f4d93a5e381560e5c2999a844ead9dd3dde5ddebf",
            "notes": "Corrige PV e PE para usar modificadores de FIS e INT, revisa C.A. e MS, adiciona Ascensão por estrela e mostra os valores passivos das perícias. Masterizada mantém a imunidade à desvantagem de Treinada e recebe +5 no passivo."
          }
          JSON

      - name: Commit release
        run: |
          rm -f release-sign/v25-ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A releases/Ficha-Livre-v2.5.apk latest.json release-sign/v25-ready
          git commit -m 'Publica Ficha Livre v2.5'
          git push
