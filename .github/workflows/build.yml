name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore sources
        run: |
          mkdir -p app/src/main/assets app/src/main/java/br/com/luan/fichalivre
          cat payload/Ficha.html.gz.b64.* | base64 -d | gzip -d > app/src/main/assets/Ficha.html
          base64 -d payload/MainActivity.java.gz.b64 | gzip -d > app/src/main/java/br/com/luan/fichalivre/MainActivity.java
      - name: Inspect class and derived-stat fields
        run: |
          python - <<'PY'
          import re
          p='app/src/main/assets/Ficha.html'
          s=open(p,encoding='utf-8').read()
          terms=['Irregular','PV','PE','C.A','CA','MS','classe','Classe','ganho','nível','nivel','level']
          for term in terms:
              print('\n###',term)
              for m in list(re.finditer(re.escape(term),s,re.I))[:30]:
                  a=max(0,m.start()-220); b=min(len(s),m.end()+420)
                  print(s[a:b].replace('\n',' '))
          PY
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ficha-livre-v2.2-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
