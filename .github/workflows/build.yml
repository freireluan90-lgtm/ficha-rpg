name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore sources
        run: |
          mkdir -p app/src/main/assets app/src/main/java/br/com/luan/fichalivre
          cat payload/Ficha.html.gz.b64.* | base64 -d | gzip -d > app/src/main/assets/Ficha.html
          base64 -d payload/MainActivity.java.gz.b64 | gzip -d > app/src/main/java/br/com/luan/fichalivre/MainActivity.java
      - name: Apply v2.3 progression patch
        run: python scripts/v23_patch.py
      - name: Apply v2.4 native updater patch
        run: python scripts/v24_updater_patch.py
      - name: Apply v2.5 rules and Ascension patch
        run: python scripts/v25_patch.py
      - name: Apply v2.6 Ascension undo patch
        run: python scripts/v26_patch.py
      - name: Apply v3.0 definitive-base patch
        run: python scripts/v30_patch.py
      - name: Apply v3.1 passive and multiple-tests patch
        run: python scripts/v31_patch.py
      - name: Apply v3.2 compact skill-result patch
        run: python scripts/v32_patch.py
      - name: Check embedded JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('app/src/main/assets/Ficha.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m and "const APP_VERSION='3.2'" in s and 'id="hpGain"' in s and 'readUpdateManifest' in s
          assert 'data-ascension' in s and 'hb+mod(fis)' in s and 'Masterizada · imune a desvantagem' in s
          assert 'Desfazer a Ascensão de' in s and 'c.passive[a]=false;c.attrs[a]=20' in s
          assert "passive=Math.min(15,(c.passive[a]?10:0)+(rank==='M'?5:0))" in s
          assert 'Soma dos ${d.n} testes' in s and '3d20+4 = 3 testes separados' in s
          assert 'class="total-detail"' in s and 'inlineDetail=`d=${raw}' in s
          open('/tmp/ficha.js','w',encoding='utf-8').write(m.group(1))
          j=open('app/src/main/java/br/com/luan/fichalivre/MainActivity.java',encoding='utf-8').read()
          assert 'fetchUpdateManifest()' in j and 'return "3.2"' in j
          PY
          node --check /tmp/ficha.js
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - name: Export Android apksigner tool
        run: |
          set -e
          TOOL=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          DIR=$(dirname "$TOOL")
          mkdir -p apksigner-tool/lib
          cp "$TOOL" apksigner-tool/apksigner
          cp "$DIR/lib/apksigner.jar" apksigner-tool/lib/apksigner.jar
          chmod +x apksigner-tool/apksigner
          echo "Using $TOOL"
      - uses: actions/upload-artifact@v4
        with:
          name: ficha-livre-v3.2-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apksigner-tool
