name: Inspect skill result source
on:
  push:
    paths:
      - '.github/workflows/inspect-dice.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore sources
        run: |
          mkdir -p app/src/main/assets app/src/main/java/br/com/luan/fichalivre
          cat payload/Ficha.html.gz.b64.* | base64 -d | gzip -d > app/src/main/assets/Ficha.html
          base64 -d payload/MainActivity.java.gz.b64 | gzip -d > app/src/main/java/br/com/luan/fichalivre/MainActivity.java
      - name: Apply patches
        run: |
          python scripts/v23_patch.py
          python scripts/v24_updater_patch.py
          python scripts/v25_patch.py
          python scripts/v26_patch.py
          python scripts/v30_patch.py
          python scripts/v31_patch.py
      - name: Show skill-result source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/Ficha.html').read_text(encoding='utf-8')
          pats=[r"#skills",r"data-skill",r"Resultado",r"lastRoll",r"switchToDice",r"function renderSkills"]
          spans=[]
          for p in pats:
              for m in re.finditer(p,s,re.I):
                  spans.append((max(0,m.start()-900),min(len(s),m.start()+2600)))
          merged=[]
          for a,b in sorted(spans):
              if not merged or a>merged[-1][1]: merged.append([a,b])
              else: merged[-1][1]=max(merged[-1][1],b)
          print('MATCHED SPANS',len(merged))
          for i,(a,b) in enumerate(merged[:30]):
              print(f'\n===== SPAN {i} {a}:{b} =====\n')
              print(s[a:b])
          PY
